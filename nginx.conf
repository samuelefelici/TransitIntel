server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html MAI in cache: dopo un deploy i riferimenti ai chunk cambiano
    # e una shell vecchia in cache rompe i dynamic import ("Invalid mapLib").
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets (hash nel nome file → immutabili)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
