# CI di Cerbero: typecheck, test dell'API, test e build della SPA, test dei solver,
# migrazioni su Postgres 17.
# Ogni job deve passare prima del merge. I test dell'API non hanno database: le rotte
# si provano con un utente iniettato (src/__tests__/helpers/app-di-prova.ts).
name: CI

# Solo pull_request: con anche `push` ogni commit su un branch di PR
# farebbe partire DUE run identici. workflow_dispatch per i rilanci a mano.
on:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # versione pnpm letta da packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installazione workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installazione workspace
        run: pnpm install --frozen-lockfile
      - name: Librerie del workspace
        run: pnpm run typecheck:libs
      - name: Test dell'API (vitest, senza database)
        run: pnpm --filter @workspace/api-server run test

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installazione workspace
        run: pnpm install --frozen-lockfile
      - name: Librerie del workspace
        run: pnpm run typecheck:libs
      - name: Test della SPA (menu, conti delle pagine)
        run: pnpm --filter @workspace/transitintel run test
      # il build della sola SPA: quello di root rifarebbe anche typecheck e API
      - name: Build della SPA
        run: pnpm --filter @workspace/transitintel run build

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      # 3.11 come python3 di node:22-bookworm-slim in Dockerfile.api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dipendenze (ortools fissato, pytest)
        run: python -m pip install -r requirements-dev.txt
      - name: Test dei solver (pytest)
        working-directory: scripts
        run: python -m pytest -q --durations=15

  # Le migrazioni su un Postgres vero, della stessa versione della produzione:
  # un database vuoto e una copia dello schema di produzione, migrati, devono
  # arrivare allo stesso schema (meta/catalogo.json); la seconda volta il
  # migratore non deve fare niente.
  migrazioni-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # bash con pipefail: senza, «comando | tail» prende l'uscita di tail
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: prova
      PG: postgresql://postgres:prova@127.0.0.1:5432
      # PR 2.8: l'app non è superutente. cerbero_app nasce NOLOGIN e senza
      # password (la dà chi gestisce il database): qui la prima migrazione la
      # crea e la CI le dà una password di prova
      PG_APP: postgresql://cerbero_app:prova@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installazione workspace
        run: pnpm install --frozen-lockfile
      - name: Database vuoto, migrato due volte
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE vuoto"
          DATABASE_URL=$PG/vuoto node lib/db/scripts/migra.mjs | tee prima.log
          grep -q "oggetti passati a cerbero_owner" prima.log
          DATABASE_URL=$PG/vuoto node lib/db/scripts/migra.mjs | tee seconda.log
          grep -q "nessuna migrazione da applicare" seconda.log
          grep -q "ruoli del database in regola" seconda.log
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE cerbero_app LOGIN PASSWORD 'prova'"
      - name: Copia dello schema di produzione, migrata
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE prod"
          # in produzione lo schema public è stato ricreato: su un database nuovo c'è già
          sed '/^CREATE SCHEMA public;$/d' lib/db/schema-produzione/2026-10-25.sql | psql -q -v ON_ERROR_STOP=1 -d prod
          # argos_ro con i permessi che ha in produzione (lettura di tutto e tabelle future)
          psql -q -v ON_ERROR_STOP=1 -d prod -f lib/db/tests/argos-come-produzione.sql
          # PR 2.8, come in produzione: public ricreato (PUBLIC non ha USAGE),
          # caronte.app_users di un'altra applicazione, una tabella di Cerbero
          # del sistema AVM, un'estensione con viste in public
          psql -q -v ON_ERROR_STOP=1 -d prod -c "REVOKE ALL ON SCHEMA public FROM PUBLIC" \
            -c "CREATE TABLE caronte.app_users (id serial PRIMARY KEY, pin text)" \
            -c "CREATE ROLE avm_esterno NOLOGIN" -c "ALTER TABLE caronte.stop_predictions OWNER TO avm_esterno" \
            -c "CREATE EXTENSION pg_stat_statements"
          # il baseline sulla produzione non deve eseguire nessun DDL: un event
          # trigger fa fallire qualunque comando che cambi lo schema
          psql -q -v ON_ERROR_STOP=1 -d prod -c "CREATE FUNCTION public.ci_ddl_vietato() RETURNS event_trigger LANGUAGE plpgsql AS \$\$ BEGIN RAISE EXCEPTION 'il baseline ha eseguito DDL sulla copia della produzione: %', tg_tag; END \$\$" \
            -c "CREATE EVENT TRIGGER ci_ddl_vietato ON ddl_command_start EXECUTE FUNCTION public.ci_ddl_vietato()"
          psql -q -v ON_ERROR_STOP=1 -1 -d prod -f lib/db/migrations/0000_baseline.sql
          psql -q -v ON_ERROR_STOP=1 -d prod -c "DROP EVENT TRIGGER ci_ddl_vietato" -c "DROP FUNCTION public.ci_ddl_vietato()"
          # PR 2.15: prima di migrare, righe senza padre come ne lascia la
          # produzione (categorie di corse cancellate, zone vietate di progetti
          # cancellati), righe vere, e una riga con la categoria cancellata
          psql -q -v ON_ERROR_STOP=1 -d prod -f lib/db/tests/chiavi-esterne-prima.sql
          DATABASE_URL=$PG/prod node lib/db/scripts/migra.mjs | tee prod.log
          # la 0010 toglie le orfane e lo scrive nel log; le vere restano, e la
          # riga con la categoria cancellata non si tocca (cambierebbe il servizio)
          grep -q "ATTENZIONE: 0010: tolte 25 righe di ps_trip_category_validity" prod.log
          grep -q "ATTENZIONE: 0010: tolte 2 zone vietate" prod.log
          psql -q -v ON_ERROR_STOP=1 -d prod -f lib/db/tests/chiavi-esterne-dopo.sql
      # PR 2.8: il migratore ha creato i ruoli e passato a cerbero_owner le
      # relazioni del catalogo. Non ha toccato estensioni, caronte.app_users,
      # cerbero_migrazioni né la tabella del sistema AVM (un errore con la
      # cura). Come cerbero_app si lavora da cerbero_owner, anche con le
      # chiavi esterne su public senza USAGE a PUBLIC; il migratore come
      # cerbero_app si ferma. PR 2.16b: l'app non esegue nessun DDL e non ha
      # CREATE sugli schemi; un database che aveva il CREATE della 2.8 lo perde.
      - name: Ruoli del database sulla copia della produzione
        run: |
          q() { psql -d prod -v ON_ERROR_STOP=1 -tAq -c "$1"; }
          if DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica > ruoli.log 2>&1; then cat ruoli.log; echo "doveva segnalare la tabella del sistema AVM"; exit 1; fi
          cat ruoli.log
          grep -q "caronte.stop_predictions è di avm_esterno" ruoli.log
          test "$(q "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                     WHERE n.nspname IN ('public', 'caronte', 'coda') AND c.relkind IN ('r', 'v', 'p')
                       AND c.relowner <> 'cerbero_owner'::regrole
                       AND c.oid NOT IN ('caronte.app_users'::regclass, 'caronte.stop_predictions'::regclass,
                                         'public.pg_stat_statements'::regclass, 'public.pg_stat_statements_info'::regclass)")" = 0
          test "$(q "SELECT string_agg(pg_get_userbyid(relowner), ',' ORDER BY relname) FROM pg_class
                     WHERE oid IN ('caronte.app_users'::regclass, 'public.pg_stat_statements'::regclass,
                                   'cerbero_migrazioni.contratti'::regclass, 'cerbero_migrazioni.__drizzle_migrations'::regclass)")" = postgres,postgres,postgres,postgres
          q "ALTER TABLE caronte.stop_predictions OWNER TO postgres"
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica
          test "$(psql "$PG_APP/prod" -tAq -c "SELECT session_user || '/' || current_user")" = cerbero_app/cerbero_owner
          # PR 2.16b: l'app non esegue DDL. Gli event trigger del migratore fermano
          # ogni comando che crea, altera o toglie un oggetto: in public, in pg_temp,
          # sulle tabelle che possiede (anche «IF NOT EXISTS» su una che c'è, come
          # facevano le unità pigre), tabelle temporanee comprese, anche da
          # cerbero_app senza il ruolo
          test "$(q "SELECT evtenabled FROM pg_event_trigger WHERE evtname = 'cerbero_ddl_dell_app'")" = A
          for vietato in "CREATE FUNCTION public.pg_try_advisory_lock(text) RETURNS boolean LANGUAGE sql AS 'SELECT true'" \
                         "CREATE FUNCTION pg_temp.f() RETURNS int LANGUAGE sql AS 'SELECT 1'" \
                         "CREATE VIEW public.ci_vista AS SELECT 1" \
                         "CREATE INDEX CONCURRENTLY ci_cic ON public.depots (name)" \
                         "CREATE INDEX ci_i ON public.depots (name)" \
                         "CREATE TRIGGER ci_t BEFORE INSERT ON caronte.tap_events FOR EACH ROW EXECUTE FUNCTION pg_catalog.suppress_redundant_updates_trigger()" \
                         "CREATE TABLE public.ci_x (a int)" \
                         "CREATE TABLE IF NOT EXISTS public.users (id int)" \
                         "ALTER TABLE public.depots ADD COLUMN IF NOT EXISTS ps_project_id uuid" \
                         "ALTER TABLE public.depots ADD CONSTRAINT ci_c CHECK (name <> '')" \
                         "ALTER TABLE public.users ALTER COLUMN email DROP NOT NULL" \
                         "DROP TABLE public.depots CASCADE" \
                         "CREATE TEMP TABLE ci_t (a int)" \
                         "CREATE TEMP TABLE ci_m ON COMMIT DROP AS SELECT 1 AS a" \
                         "SELECT 1 AS a INTO TEMP ci_s" \
                         "GRANT SELECT ON public.users TO PUBLIC" \
                         "COMMENT ON TABLE public.depots IS 'ci'" \
                         "RESET ROLE; CREATE TEMP TABLE ci_t (a int)"; do
            if psql "$PG_APP/prod" -q -c "$vietato" 2> vietato.log; then echo "cerbero_app non doveva poter: $vietato"; exit 1; fi
            grep -q "cerbero_app non può eseguire" vietato.log || { cat vietato.log; exit 1; }
          done
          # la seconda serratura: nessun CREATE sugli schemi, per nessuno dei due ruoli dell'app
          senza_create() { test "$(q "SELECT count(*) FROM unnest(ARRAY['public', 'caronte', 'coda', 'cerbero_migrazioni', 'registro']) s
                                      WHERE has_schema_privilege('cerbero_owner', s, 'CREATE') OR has_schema_privilege('cerbero_app', s, 'CREATE')")" = 0; }
          senza_create
          # un database che ha visto la 2.8 ce l'ha ancora: la verifica lo dice, il riallineamento lo toglie
          q "GRANT CREATE ON SCHEMA public, caronte, coda TO cerbero_owner; GRANT CREATE ON SCHEMA public TO cerbero_app"
          if DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica > ruoli.log 2>&1; then cat ruoli.log; echo "doveva segnalare il CREATE sugli schemi"; exit 1; fi
          grep -q 'REVOKE CREATE ON SCHEMA "caronte" FROM "cerbero_owner"' ruoli.log || { cat ruoli.log; exit 1; }
          grep -q 'REVOKE CREATE ON SCHEMA "public" FROM "cerbero_app"' ruoli.log || { cat ruoli.log; exit 1; }
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs > /dev/null
          senza_create
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica
          # i dati li scrive come prima
          psql "$PG_APP/prod" -v ON_ERROR_STOP=1 -q -c "BEGIN" -c "INSERT INTO public.depots (name) VALUES ('ci')" \
            -c "UPDATE public.depots SET name = 'ci2' WHERE name = 'ci'" -c "DELETE FROM public.depots WHERE name = 'ci2'" -c "ROLLBACK"
          # La sola eccezione: dentro le funzioni del registro delle modifiche (SECURITY
          # DEFINER di cerbero_registro) passano CREATE TABLE e ALTER TABLE, per la
          # partizione del mese, e nient'altro. A fine comando restano vietate le
          # funzioni non ammesse in default e vincoli, anche attraverso un tipo: le
          # eseguirebbe come superutente chi scrive la riga da superutente o ripristina
          # un backup. Una funzione di prova fa da tramite, come una del registro.
          test "$(q "SELECT count(*) FROM pg_event_trigger WHERE evtname = 'cerbero_ddl_dell_app_fine' AND evtevent = 'ddl_command_end' AND evtenabled = 'A'")" = 1
          q "CREATE FUNCTION registro.ci_esegue(c text) RETURNS void LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS \$\$ BEGIN EXECUTE c; END \$\$;
             ALTER FUNCTION registro.ci_esegue(text) OWNER TO cerbero_registro; REVOKE ALL ON FUNCTION registro.ci_esegue(text) FROM PUBLIC;
             GRANT EXECUTE ON FUNCTION registro.ci_esegue(text) TO cerbero_owner;
             CREATE DOMAIN registro.ci_dominio AS int CHECK (pg_catalog.pg_read_file('PG_VERSION') IS NOT NULL)"
          tramite() { psql "$PG_APP/prod" -v ON_ERROR_STOP=1 -q -c "SELECT registro.ci_esegue(\$ci\$$1\$ci\$)"; }
          for vietato in "CREATE VIEW registro.ci_v AS SELECT 1" "CREATE INDEX ci_i ON registro.letture (ts)" \
                         "CREATE FUNCTION registro.ci_f() RETURNS int LANGUAGE sql AS 'SELECT 1'" "DROP TABLE registro.letture" \
                         "CREATE TABLE registro.ci_t AS SELECT 1 AS a" "CREATE TEMP TABLE ci_t AS SELECT 1 AS a"; do
            if tramite "$vietato" 2> vietato.log; then echo "dentro una funzione del registro non doveva passare: $vietato"; exit 1; fi
            grep -q "le funzioni del registro delle modifiche non eseguono" vietato.log || { cat vietato.log; exit 1; }
          done
          for vietato in "CREATE TABLE registro.ci_x (a text DEFAULT pg_catalog.table_to_xml('pg_catalog.pg_class'::regclass, false, false, '')::text)" \
                         "CREATE TABLE registro.ci_x (a int CHECK (pg_catalog.query_to_xml('select 1', false, false, '') IS NOT NULL))" \
                         "CREATE TABLE registro.ci_x (a text DEFAULT pg_catalog.current_setting('data_directory'))" \
                         "CREATE TABLE registro.ci_d (id int, c registro.ci_dominio)" \
                         "CREATE TABLE registro.ci_d (id int CHECK ((id::registro.ci_dominio) IS NOT NULL))"; do
            if tramite "$vietato" 2> vietato.log; then echo "dentro una funzione del registro non doveva passare: $vietato"; exit 1; fi
            grep -q "cerbero_app non può usare queste funzioni" vietato.log || { cat vietato.log; exit 1; }
          done
          tramite "CREATE TABLE registro.ci_ok (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, n int CHECK (n >= 0), s text DEFAULT lower(btrim(' A ')), t timestamptz DEFAULT now(), a int[] DEFAULT '{}')"
          tramite "ALTER TABLE registro.ci_ok ADD COLUMN c int"
          # su una tabella di Cerbero no, nemmeno da lì: non è del registro (che qui, come in
          # produzione, non entra nemmeno in public)
          if tramite "ALTER TABLE public.users DISABLE TRIGGER registro_cambia" 2> vietato.log; then echo "il registro non doveva toccare users"; exit 1; fi
          grep -Eq "must be owner of table users|permission denied for schema public" vietato.log || { cat vietato.log; exit 1; }
          q "DROP TABLE registro.ci_ok; DROP FUNCTION registro.ci_esegue(text); DROP DOMAIN registro.ci_dominio"
          # un'espressione vietata che c'era già (di prima della 2.8, o messa da un
          # superutente): la verifica la segnala con la cura, il migratore non migra
          q "ALTER TABLE public.depots ADD CONSTRAINT ci_c CHECK (pg_catalog.query_to_xml('select 1', false, false, '') IS NOT NULL) NOT VALID"
          if DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica > ruoli.log 2>&1; then cat ruoli.log; echo "doveva segnalare il vincolo"; exit 1; fi
          grep -q "public.depots: il vincolo ci_c usa query_to_xml(text,boolean,boolean,text), fuori da quello che è ammesso" ruoli.log || { cat ruoli.log; exit 1; }
          psql -d postgres -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE ci_espr"
          psql -d ci_espr -v ON_ERROR_STOP=1 -q -c "CREATE TABLE public.depots (name text CHECK (pg_catalog.query_to_xml('select 1', false, false, '') IS NOT NULL))"
          if DATABASE_URL=$PG/ci_espr node lib/db/scripts/migra.mjs > migra-espr.log 2>&1; then cat migra-espr.log; echo "il migratore non doveva migrare"; exit 1; fi
          grep -q "non migro: un'espressione di una tabella di Cerbero usa funzioni non ammesse" migra-espr.log || { cat migra-espr.log; exit 1; }
          test "$(psql -d ci_espr -tAq -c "SELECT to_regclass('cerbero_migrazioni.__drizzle_migrations') IS NULL")" = t
          psql -d postgres -q -c "DROP DATABASE ci_espr"
          q "ALTER TABLE public.depots DROP CONSTRAINT ci_c"
          # una tabella di un superutente fuori dal catalogo (un backup fatto a mano): solo un avviso, l'app parte
          q "CREATE TABLE public.ci_backup AS SELECT * FROM public.depots"
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica > ruoli.log 2>&1 || { cat ruoli.log; exit 1; }
          grep -q "public.ci_backup è di postgres (superutente) e non è nel catalogo" ruoli.log || { cat ruoli.log; exit 1; }
          q "DROP TABLE public.ci_backup"
          # una chiave esterna si controlla come il proprietario della tabella: serve USAGE su public
          psql "$PG_APP/prod" -v ON_ERROR_STOP=1 -q -c "BEGIN" \
            -c "INSERT INTO gtfs_feeds (id, filename) VALUES ('00000000-0000-0000-0000-0000000000f9', 'ci.zip')" \
            -c "INSERT INTO gtfs_fare_transfer_rules (feed_id) VALUES ('00000000-0000-0000-0000-0000000000f9')" \
            -c "SELECT count(*) FROM cerbero_migrazioni.__drizzle_migrations" -c "ROLLBACK"
          if psql "$PG_APP/prod" -tAq -c "SELECT count(*) FROM caronte.app_users" 2>/dev/null; then echo "cerbero_app non deve leggere caronte.app_users"; exit 1; fi
          if DATABASE_URL=$PG_APP/prod node lib/db/scripts/migra.mjs > migra-app.log 2>&1; then cat migra-app.log; echo "il migratore come cerbero_app doveva fermarsi"; exit 1; fi
          grep -q "non si eseguono come cerbero_app" migra-app.log
          # Il ruolo di Caronte (caronte_setup.sql). app_users, qui di postgres e con
          # un serial come in produzione prima del passaggio, diventa sua: la «crea
          # se non c'è» come fa Caronte a ogni login e ci scrive. Rieseguito il
          # file, le tabelle di Caronte restano scrivibili (il REVOKE toglie i
          # diritti anche al proprietario: si ridanno). Non legge gli utenti, non
          # scrive gli archivi di Cerbero, non tocca le sue tabelle, non crea in
          # public. La verifica dei ruoli ricorda con un avviso, non con un
          # errore, che può creare in caronte, e segnala un vincolo pericoloso
          # messo su una tabella sua (lo eseguirebbe un superutente che ci scrive
          # o ripristina un backup).
          DATABASE_URL=$PG/prod node lib/db/scripts/run-sql.mjs caronte_setup.sql
          test "$(q "SELECT string_agg(pg_get_userbyid(relowner), ',' ORDER BY relname) FROM pg_class
                     WHERE oid IN ('caronte.app_users'::regclass, 'caronte.app_users_id_seq'::regclass)")" = caronte_app,caronte_app
          q "SET ROLE caronte_app; CREATE TABLE IF NOT EXISTS caronte.app_users (id serial PRIMARY KEY, pin text);
             INSERT INTO caronte.app_users (pin) VALUES ('ci'); SELECT count(*) FROM public.gtfs_routes;
             DELETE FROM caronte.vehicle_positions WHERE false; SELECT count(*) FROM caronte.avm_diario;
             CREATE TABLE caronte.ci_di_caronte (id serial PRIMARY KEY, n int); INSERT INTO caronte.ci_di_caronte (n) VALUES (1)" > /dev/null
          DATABASE_URL=$PG/prod node lib/db/scripts/run-sql.mjs caronte_setup.sql
          q "SET ROLE caronte_app; INSERT INTO caronte.app_users (pin) VALUES ('ci2'); INSERT INTO caronte.ci_di_caronte (n) VALUES (2)"
          for vietato in "SELECT count(*) FROM public.users" "INSERT INTO caronte.avm_diario DEFAULT VALUES" \
                         "ALTER TABLE caronte.tap_events ADD COLUMN ci int" "DROP TABLE caronte.active_trips" \
                         "CREATE TABLE public.ci_caronte (a int)" "SELECT count(*) FROM registro.modifiche"; do
            if q "SET ROLE caronte_app; $vietato" 2> vietato.log; then echo "caronte_app non doveva poter: $vietato"; exit 1; fi
            grep -q -E "permission denied|must be owner" vietato.log || { cat vietato.log; exit 1; }
          done
          q "SET ROLE caronte_app; ALTER TABLE caronte.app_users ADD CONSTRAINT ci_pin CHECK (pg_catalog.query_to_xml('select 1', false, false, '') IS NOT NULL) NOT VALID"
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica > ruoli.log 2>&1 || { cat ruoli.log; exit 1; }
          grep -q "ATTENZIONE: caronte_app può creare tabelle e funzioni nello schema caronte" ruoli.log || { cat ruoli.log; exit 1; }
          grep -q "ATTENZIONE: caronte.app_users (di caronte_app, non di Cerbero): il vincolo ci_pin usa query_to_xml" ruoli.log || { cat ruoli.log; exit 1; }
          q "ALTER TABLE caronte.app_users DROP CONSTRAINT ci_pin; DROP TABLE caronte.ci_di_caronte; REVOKE CREATE ON SCHEMA caronte FROM caronte_app"
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica | grep -q "ruoli e proprietari in regola: "
          # La password di cerbero_app in un passo (ruoli.mjs --imposta-password).
          # Stampa l'URL con la password: fuori da un terminale si rifiuta. Coi
          # ruoli fuori posto si ferma prima di cambiarla, e con l'app collegata
          # anche (cambiarla le chiuderebbe la porta). Cambiata, al database c'è
          # solo l'impronta, entra solo l'URL stampato, e la password di prima non
          # vale più. Chi non è superutente non la cambia.
          if DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --imposta-password > password.log 2>&1; then echo "fuori da un terminale doveva rifiutarsi"; exit 1; fi
          grep -q "si lancia da un terminale" password.log
          psql -q -v ON_ERROR_STOP=1 -c "ALTER ROLE cerbero_app RESET role"
          if DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --imposta-password --senza-terminale > password.log 2>&1; then echo "coi ruoli fuori posto doveva fermarsi"; exit 1; fi
          grep -q "i ruoli non sono in regola" password.log
          test "$(psql "$PG_APP/prod" -tAq -c "SELECT session_user")" = cerbero_app
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs > /dev/null
          psql "$PG_APP/prod" -q -c "SELECT pg_sleep(60)" > /dev/null 2>&1 &
          until test "$(q "SELECT count(*) FROM pg_stat_activity WHERE usename = 'cerbero_app'")" = 1; do sleep 0.5; done
          if DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --imposta-password --senza-terminale > password.log 2>&1; then echo "con l'app collegata doveva rifiutarsi"; exit 1; fi
          grep -q "cerbero_app è collegato adesso (1 sessione)" password.log
          test "$(psql "$PG_APP/prod" -tAq -c "SELECT 1")" = 1
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --imposta-password --senza-terminale --anche-se-collegata > password.log
          grep -q "l'URL va bene" password.log
          URL_APP=$(grep "^postgres" password.log)
          test "$(psql "$URL_APP" -tAq -c "SELECT session_user || '/' || current_user")" = cerbero_app/cerbero_owner
          if psql "$PG_APP/prod" -tAq -c "SELECT 1" 2> /dev/null; then echo "la password di prima doveva smettere di valere"; exit 1; fi
          test "$(q "SELECT rolpassword ~ '^SCRAM-SHA-256[$]4096:' AND rolcanlogin FROM pg_authid WHERE rolname = 'cerbero_app'")" = t
          if DATABASE_URL=$URL_APP node lib/db/scripts/ruoli.mjs --imposta-password --senza-terminale --anche-se-collegata > password.log 2>&1; then echo "chi non è superutente non doveva cambiarla"; exit 1; fi
          grep -q "serve un superutente (postgres): qui ci si collega come cerbero_app" password.log
          test "$(psql "$URL_APP" -tAq -c "SELECT 1")" = 1
          q "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE usename = 'cerbero_app'" > /dev/null
          wait || true
          psql -v ON_ERROR_STOP=1 -q -c "ALTER ROLE cerbero_app LOGIN PASSWORD 'prova'"
          rm -f password.log
          # fuori dal catalogo atteso: si toglie prima del confronto; e public torna
          # come su un database nuovo, perché i casi di Argos qui sotto lo danno per scontato
          q "DROP TABLE caronte.app_users"
          q "GRANT USAGE ON SCHEMA public TO PUBLIC"
      # Il catalogo descrive solo quello che è di Cerbero: gli oggetti di
      # un'estensione ne restano fuori. In produzione PostGIS mette in public
      # spatial_ref_sys, con la sua chiave e un CHECK, e due viste, e il
      # confronto con lo schema atteso le dava per differenze. Qui l'estensione
      # è pg_stat_statements, con le sue due viste; una tabella e una sequenza
      # di prova diventano sue (ALTER EXTENSION … ADD lascia in pg_depend lo
      # stesso legame di CREATE EXTENSION). Con l'estensione al suo posto la
      # copia della produzione ha già lo schema atteso. Poi si toglie, e i suoi
      # oggetti con lei: i passi qui sotto sono scritti senza.
      - name: Gli oggetti di un'estensione restano fuori dal catalogo
        run: |
          q() { psql -d prod -v ON_ERROR_STOP=1 -tAq -c "$1"; }
          q "CREATE TABLE public.ci_di_estensione (srid integer PRIMARY KEY, CONSTRAINT ci_di_estensione_srid_check CHECK (srid > 0));
             CREATE SEQUENCE public.ci_di_estensione_seq;
             ALTER EXTENSION pg_stat_statements ADD TABLE public.ci_di_estensione;
             ALTER EXTENSION pg_stat_statements ADD SEQUENCE public.ci_di_estensione_seq"
          DATABASE_URL=$PG/prod node lib/db/scripts/catalogo.mjs > con-estensione.json
          node lib/db/scripts/catalogo.mjs --confronta lib/db/migrations/meta/catalogo.json con-estensione.json
          q "DROP EXTENSION pg_stat_statements"
      # PR 2.10: il registro delle modifiche (migrazione 0006). Nasce spento: il
      # test SQL lo accende dentro una transazione annullata e controlla cosa
      # registra e cosa no (hash, codici del roster, valori di utenti e roster),
      # riepiloghi, cascate, anonimizzazione e conservazione. Come cerbero_app:
      # non lo legge, non lo spegne, non rinomina una tabella sorvegliata (dalla
      # 2.16b non altera nessuna tabella); la manutenzione sì, anche due volte,
      # e crea la partizione che manca; dalla 2.11 lo legge con leggi() (mai
      # per persona, e la consultazione resta annotata). Un trigger spento da un superutente fa
      # fallire la verifica dei ruoli. Poi resta acceso su vuoto e
      # solo_migrazioni: API, lavoratore e test sul database scrivono come
      # cerbero_app attraverso i trigger.
      # PR 2.15: le chiavi esterne che mancavano in Planning Studio (categorie
      # delle corse → corsa, zone vietate → progetto). Su tutti e due i
      # database sono valide; come cerbero_owner una riga senza padre non si
      # scrive più e la cancellazione del padre porta via le figlie. Sulla
      # categoria non c'è vincolo: va deciso con i dati di produzione (DEPLOY).
      - name: Le chiavi esterne di Planning Studio
        run: |
          for d in vuoto prod; do
            psql -q -v ON_ERROR_STOP=1 -d $d -f lib/db/tests/chiavi-esterne.test.sql
          done
          # su un database senza righe orfane la 0010 non avvisa di niente
          ! grep -q "ATTENZIONE: 0010" prima.log
      - name: Il registro delle modifiche
        run: |
          # come in produzione, PUBLIC senza USAGE su public: le funzioni del
          # registro girano come cerbero_registro, che non ce l'ha
          psql -d prod -v ON_ERROR_STOP=1 -q -c "REVOKE USAGE ON SCHEMA public FROM PUBLIC"
          for d in vuoto prod; do
            test "$(psql -d $d -tAq -c "SELECT attivo FROM registro.impostazioni")" = f
            psql -q -v ON_ERROR_STOP=1 -d $d -f lib/db/tests/registro.test.sql
            # annullato: di nuovo spento e vuoto
            test "$(psql -d $d -tAq -c "SELECT (SELECT attivo FROM registro.impostazioni)::text || '/' || (SELECT count(*) FROM registro.modifiche)")" = false/0
          done
          app() { psql "$PG_APP/prod" -v ON_ERROR_STOP=1 -tAq -c "$1"; }
          # PR 2.16b: sulle tabelle sorvegliate l'app non spegne i trigger, non rinomina,
          # non riscrive, non tocca la colonna calcolata mfa_obbligatoria (PR 2.12: è una
          # regola) né le colonne da cui dipende. Ogni ALTER TABLE si ferma all'inizio
          # del comando; prima passavano DROP EXPRESSION e DROP COLUMN … CASCADE.
          for vietato in "ALTER TABLE public.users DISABLE TRIGGER registro_cambia" \
                         "ALTER TABLE public.roster_entries DISABLE TRIGGER USER" \
                         "ALTER TABLE public.ps_projects ENABLE REPLICA TRIGGER registro_cambia" \
                         "ALTER TABLE public.depots RENAME TO depots_altrove" \
                         "ALTER TABLE public.users RENAME COLUMN role TO role_cached" \
                         "ALTER TABLE public.users ALTER COLUMN full_name TYPE text USING 'Altro'" \
                         "ALTER TABLE public.users ALTER COLUMN mfa_obbligatoria SET EXPRESSION AS (false)" \
                         "ALTER TABLE public.users DROP COLUMN mfa_obbligatoria, ADD COLUMN mfa_obbligatoria boolean GENERATED ALWAYS AS (false) STORED" \
                         "ALTER TABLE public.users ALTER COLUMN mfa_obbligatoria DROP EXPRESSION" \
                         "ALTER TABLE public.users DROP COLUMN mfa_obbligatoria" \
                         "ALTER TABLE public.users ALTER COLUMN role TYPE text USING 'admin'" \
                         "ALTER TABLE public.users DROP COLUMN permissions CASCADE" \
                         "ALTER TABLE public.ps_projects INHERIT public.depots"; do
            if app "$vietato" 2> vietato.log; then echo "cerbero_app non doveva poter: $vietato"; exit 1; fi
            grep -q "cerbero_app non può eseguire ALTER TABLE" vietato.log || { cat vietato.log; exit 1; }
          done
          # né le mette accanto una figlia o una tabella temporanea con lo stesso nome
          for vietato in "CREATE TABLE public.ci_figlia () INHERITS (public.ps_projects)" \
                         "CREATE TEMP TABLE ci_figlia () INHERITS (public.users)" \
                         "CREATE TEMP TABLE users AS SELECT * FROM public.users"; do
            if app "$vietato" 2> vietato.log; then echo "cerbero_app non doveva poter: $vietato"; exit 1; fi
            grep -q "cerbero_app non può eseguire CREATE TABLE" vietato.log || { cat vietato.log; exit 1; }
          done
          test "$(app "SELECT count(*) FROM pg_event_trigger WHERE evtname = 'cerbero_ddl_dell_app_riscrive' AND evtevent = 'table_rewrite' AND evtenabled = 'A'")" = 1
          # Se la colonna calcolata cambia per un'altra strada (un ripristino, un comando a
          # mano: qui da postgres), la verifica dei ruoli lo dice, con l'istruzione per
          # rifarla, e rifatta torna pulita. Con FleetCare nello stesso database (il suo
          # ruolo che legge gli utenti): rifare la colonna gli toglie la lettura, e il
          # riallineamento dei ruoli gliela ridà.
          psql -d prod -v ON_ERROR_STOP=1 -q -c "CREATE ROLE fleetcare_legge_cerbero NOLOGIN"
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs > /dev/null
          legge() { psql -d prod -tAq -c "SELECT has_column_privilege('fleetcare_legge_cerbero', 'public.users', 'mfa_obbligatoria', 'SELECT')"; }
          test "$(legge)" = t
          psql -d prod -v ON_ERROR_STOP=1 -q -c "ALTER TABLE public.users ALTER COLUMN mfa_obbligatoria DROP EXPRESSION"
          if DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica > ruoli.log 2>&1; then cat ruoli.log; echo "doveva segnalare la colonna non più calcolata"; exit 1; fi
          grep -q "public.users.mfa_obbligatoria non è più calcolata dal database" ruoli.log || { cat ruoli.log; exit 1; }
          CURA=$(grep -o 'ALTER TABLE "public"."users" DROP COLUMN "mfa_obbligatoria".* STORED' ruoli.log)
          test -n "$CURA"
          psql -d prod -v ON_ERROR_STOP=1 -q -c "$CURA"
          test "$(legge)" = f
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs > /dev/null
          test "$(legge)" = t
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica > ruoli.log 2>&1 || { cat ruoli.log; exit 1; }
          test "$(psql -d prod -tAq -c "SELECT attgenerated FROM pg_attribute WHERE attrelid = 'public.users'::regclass AND attname = 'mfa_obbligatoria'")" = s
          psql -d prod -v ON_ERROR_STOP=1 -q -c "DROP OWNED BY fleetcare_legge_cerbero" -c "DROP ROLE fleetcare_legge_cerbero"
          for vietato in "SELECT count(*) FROM registro.modifiche" "UPDATE registro.impostazioni SET attivo = false" \
                         "DROP TRIGGER registro_cambia ON public.users" "SELECT registro.cattura()" \
                         "SELECT count(*) FROM registro.letture" "SELECT count(*) FROM registro.parziali" \
                         "SELECT registro.somma(pg_current_xact_id())" "ALTER TABLE registro.parziali DISABLE TRIGGER registro_chiude"; do
            if app "$vietato" 2> vietato.log; then echo "cerbero_app non doveva poter: $vietato"; exit 1; fi
            grep -Eq "permission denied|must be owner|non può" vietato.log || { cat vietato.log; exit 1; }
          done
          # la sola eccezione al divieto: la manutenzione crea la partizione che manca, anche chiamata dall'app
          ULTIMA=$(psql -d prod -tAq -c "SELECT c.relname FROM pg_inherits i JOIN pg_class c ON c.oid = i.inhrelid WHERE i.inhparent = 'registro.modifiche'::regclass AND c.relname ~ '_[0-9]{4}_[0-9]{2}\$' ORDER BY 1 DESC LIMIT 1")
          psql -d prod -v ON_ERROR_STOP=1 -q -c "ALTER TABLE registro.modifiche DETACH PARTITION registro.$ULTIMA" -c "DROP TABLE registro.$ULTIMA"
          app "SELECT registro.manutenzione()" | grep -q "\"partizioni\": \[\"$ULTIMA\"\]"
          test "$(psql -d prod -tAq -c "SELECT pg_get_userbyid(relowner) FROM pg_class WHERE oid = 'registro.$ULTIMA'::regclass")" = cerbero_registro
          app "SELECT registro.manutenzione()" | grep -q '"partizioni": \[\]'
          test -z "$(app "SELECT * FROM registro.verifica()")"
          # PR 2.11: l'app lo legge solo con leggi(), che annota la consultazione e non filtra per persona
          test "$(app "SELECT registro.stato() ->> 'attivo'")" = false
          app "SELECT count(*) FROM registro.leggi('{}', 10)"
          if app "SELECT * FROM registro.leggi('{\"attore\": \"x\"}', 10)" 2> vietato.log; then echo "leggi() non doveva filtrare per persona"; exit 1; fi
          grep -q "il registro non si legge per persona" vietato.log || { cat vietato.log; exit 1; }
          # a registro spento e vuoto la consultazione non si annota (la pagina la chiama appena si apre)
          test "$(psql -d prod -tAq -c "SELECT count(*) FROM registro.letture")" = 0
          # un trigger spento da un superutente: la verifica dei ruoli fallisce, con la cura
          psql -d prod -v ON_ERROR_STOP=1 -q -c "ALTER TABLE public.users DISABLE TRIGGER registro_cambia"
          if DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica > ruoli.log 2>&1; then cat ruoli.log; echo "doveva segnalare il trigger spento"; exit 1; fi
          grep -q "registro delle modifiche: public.users: il trigger registro_cambia del registro non è acceso sempre" ruoli.log || { cat ruoli.log; exit 1; }
          psql -d prod -v ON_ERROR_STOP=1 -q -c "ALTER TABLE public.users ENABLE ALWAYS TRIGGER registro_cambia"
          DATABASE_URL=$PG/prod node lib/db/scripts/ruoli.mjs --verifica > ruoli.log 2>&1 || { cat ruoli.log; exit 1; }
          DATABASE_URL=$PG/vuoto node lib/db/scripts/migra.mjs | grep -q "ruoli del database in regola"
          psql -d prod -v ON_ERROR_STOP=1 -q -c "GRANT USAGE ON SCHEMA public TO PUBLIC"
          # acceso per i passi dopo (in produzione lo accende chi ha la base giuridica)
          psql -d vuoto -v ON_ERROR_STOP=1 -q -c "UPDATE registro.impostazioni SET attivo = true, base_giuridica = 'prova della CI', attivato_il = now()"
      # Il migratore ha riportato argos_ro al contratto. Poi qualcuno rilancia lo
      # script di Argos (lettura di tutto): la verifica se ne accorge, la cura
      # sistema, e di nuovo tutto in regola.
      - name: Argos legge solo le tabelle del contratto
        run: |
          contratto=$(node -e 'import("./lib/db/contratti/argos-lettura.mjs").then(m => console.log(m.ARGOS_LETTURA.join(",")))')
          prova() { psql -q -v ON_ERROR_STOP=1 -d prod -v contratto="$contratto" -f lib/db/tests/argos-lettura.test.sql; }
          DATABASE_URL=$PG/prod node lib/db/scripts/argos-permessi.mjs --verifica
          prova
          psql -q -v ON_ERROR_STOP=1 -d prod -f lib/db/tests/argos-come-produzione.sql
          if DATABASE_URL=$PG/prod node lib/db/scripts/argos-permessi.mjs --verifica > verifica.log; then
            cat verifica.log; echo "la verifica doveva accorgersene"; exit 1
          fi
          grep -q "public.users: fuori dal contratto" verifica.log
          if prova 2>/dev/null; then echo "il test SQL doveva fallire"; exit 1; fi
          DATABASE_URL=$PG/prod node lib/db/scripts/argos-permessi.mjs
          DATABASE_URL=$PG/prod node lib/db/scripts/argos-permessi.mjs --verifica
          prova
      # I casi difficili, dalla revisione: quelli che il riallineamento sistema
      # da solo, e quelli che deve solo segnalare con l'istruzione giusta
      # (toccano altri ruoli o servono i loro diritti). Dopo ognuno, tutto
      # torna in regola. Poi il commit parziale (una correzione impossibile non
      # blocca le altre) e il rollback (vince il contratto più nuovo salvato
      # nel database, finché non si usa --forza).
      - name: Argos, i casi difficili
        run: |
          contratto=$(node -e 'import("./lib/db/contratti/argos-lettura.mjs").then(m => console.log(m.ARGOS_LETTURA.join(",")))')
          p() { DATABASE_URL=$PG/prod node lib/db/scripts/argos-permessi.mjs "$@"; }
          s() { psql -q -v ON_ERROR_STOP=1 -d prod -c "$1"; }
          prova() { psql -q -v ON_ERROR_STOP=1 -d prod -v contratto="${1:-$contratto}" -f lib/db/tests/argos-lettura.test.sql; }
          in_regola() {
            p --verifica > v.log || { cat v.log; exit 1; }
            grep -q "in regola" v.log || { cat v.log; exit 1; }
            prova
          }
          # $1 preparazione: il riallineamento la corregge da solo
          da_solo() {
            echo "::group::da solo: $1"; s "$1"
            if p --verifica > v.log; then cat v.log; echo "la verifica doveva accorgersene"; exit 1; fi
            if prova 2>/dev/null; then echo "il test SQL doveva fallire"; exit 1; fi
            p; in_regola; echo "::endgroup::"
          }
          # $1 preparazione, $2 testo atteso nell'errore, $3 la cura a mano
          a_mano() {
            echo "::group::a mano: $1"; s "$1"
            if p > v.log 2>&1; then cat v.log; echo "doveva chiedere un intervento a mano"; exit 1; fi
            grep -qF -- "$2" v.log || { cat v.log; echo "manca nel messaggio: $2"; exit 1; }
            if prova 2>/dev/null; then echo "il test SQL doveva fallire"; exit 1; fi
            s "$3"; p; in_regola; echo "::endgroup::"
          }
          psql -q -v ON_ERROR_STOP=1 -c "CREATE ROLE terzo"
          da_solo "GRANT MAINTAIN ON public.users, public.gtfs_stops TO argos_ro"
          da_solo 'CREATE TABLE public."report.2026" (id int); GRANT SELECT ON public."report.2026" TO argos_ro'
          s 'DROP TABLE public."report.2026"'
          a_mano "GRANT SELECT (id) ON public.users TO PUBLIC" 'REVOKE ALL ON TABLE "public"."users" FROM PUBLIC' \
            "REVOKE ALL ON public.users FROM PUBLIC"
          a_mano "GRANT INSERT ON public.gtfs_stops TO PUBLIC" 'REVOKE INSERT ON TABLE "public"."gtfs_stops" FROM PUBLIC' \
            "REVOKE INSERT ON public.gtfs_stops FROM PUBLIC"
          a_mano "GRANT USAGE ON public.accessi_log_id_seq TO PUBLIC" 'REVOKE ALL ON SEQUENCE "public"."accessi_log_id_seq" FROM PUBLIC' \
            "REVOKE ALL ON public.accessi_log_id_seq FROM PUBLIC"
          a_mano "GRANT CREATE ON SCHEMA caronte TO PUBLIC" 'REVOKE CREATE ON SCHEMA "caronte" FROM PUBLIC' \
            "REVOKE CREATE ON SCHEMA caronte FROM PUBLIC"
          a_mano "ALTER DEFAULT PRIVILEGES FOR ROLE postgres GRANT SELECT ON TABLES TO PUBLIC" 'REVOKE ALL ON TABLES FROM PUBLIC' \
            "ALTER DEFAULT PRIVILEGES FOR ROLE postgres REVOKE ALL ON TABLES FROM PUBLIC"
          a_mano "ALTER SCHEMA caronte OWNER TO argos_ro" "proprietario di schema caronte" "ALTER SCHEMA caronte OWNER TO postgres"
          a_mano "ALTER DATABASE prod OWNER TO argos_ro" "proprietario di database prod" "ALTER DATABASE prod OWNER TO postgres"
          a_mano "GRANT pg_read_all_data TO argos_ro" "membro di pg_read_all_data" "REVOKE pg_read_all_data FROM argos_ro"
          a_mano "ALTER ROLE argos_ro REPLICATION" "NOREPLICATION" "ALTER ROLE argos_ro NOREPLICATION"
          a_mano "GRANT SELECT ON public.depots TO terzo WITH GRANT OPTION; SET ROLE terzo; GRANT SELECT ON public.depots TO argos_ro; RESET ROLE" \
            'SET ROLE "terzo"; REVOKE ALL ON TABLE "public"."depots" FROM "argos_ro"' \
            "SET ROLE terzo; REVOKE ALL ON public.depots FROM argos_ro; RESET ROLE; REVOKE ALL ON public.depots FROM terzo"
          da_solo "GRANT EXECUTE ON FUNCTION pg_catalog.pg_read_binary_file(text) TO argos_ro"
          da_solo "GRANT SET ON PARAMETER session_replication_role TO argos_ro"
          da_solo "CREATE SCHEMA altro; CREATE TABLE altro.t (x int); GRANT USAGE, CREATE ON SCHEMA altro TO argos_ro; GRANT INSERT ON altro.t TO argos_ro"
          s "DROP SCHEMA altro CASCADE"
          a_mano "CREATE FUNCTION public.ci_conta() RETURNS bigint LANGUAGE sql SECURITY DEFINER AS 'SELECT count(*) FROM public.users'" \
            'REVOKE EXECUTE ON ROUTINE "public"."ci_conta"() FROM PUBLIC' "REVOKE EXECUTE ON FUNCTION public.ci_conta() FROM PUBLIC"
          s "DROP FUNCTION public.ci_conta()"
          a_mano "ALTER ROLE argos_ro CREATEDB" "NOCREATEDB" "ALTER ROLE argos_ro NOCREATEDB"
          psql -q -v ON_ERROR_STOP=1 -c "CREATE ROLE ammin"
          a_mano "GRANT pg_read_all_data TO ammin WITH ADMIN OPTION; SET ROLE ammin; GRANT pg_read_all_data TO argos_ro; RESET ROLE" \
            'GRANTED BY "ammin"' "REVOKE pg_read_all_data FROM argos_ro GRANTED BY ammin; REVOKE pg_read_all_data FROM ammin"
          a_mano "GRANT CREATE ON SCHEMA caronte TO terzo WITH GRANT OPTION; SET ROLE terzo; GRANT CREATE ON SCHEMA caronte TO argos_ro; RESET ROLE" \
            'SET ROLE "terzo"; REVOKE ALL ON SCHEMA "caronte" FROM "argos_ro"' \
            "SET ROLE terzo; REVOKE ALL ON SCHEMA caronte FROM argos_ro; RESET ROLE; GRANT USAGE ON SCHEMA caronte TO argos_ro; REVOKE ALL ON SCHEMA caronte FROM terzo"
          da_solo "SELECT lo_from_bytea(424242, 'segreto'); GRANT SELECT, UPDATE ON LARGE OBJECT 424242 TO argos_ro"
          s "SELECT lo_unlink(424242)"
          a_mano "CREATE SCHEMA rep; CREATE VIEW rep.dump AS SELECT email FROM public.users; GRANT USAGE ON SCHEMA rep TO PUBLIC; GRANT SELECT ON rep.dump TO PUBLIC" \
            'REVOKE SELECT ON ALL TABLES IN SCHEMA "rep" FROM PUBLIC' "REVOKE SELECT ON rep.dump FROM PUBLIC"
          s "DROP SCHEMA rep CASCADE"
          a_mano "GRANT SELECT (rolname, rolpassword) ON pg_catalog.pg_authid TO PUBLIC" "pg_catalog.pg_authid" \
            "REVOKE SELECT (rolname, rolpassword) ON pg_catalog.pg_authid FROM PUBLIC"
          # senza USAGE sullo schema: la sequenza si usa per OID, MAINTAIN vale per VACUUM e
          # ANALYZE senza elenco, e un SELECT si legge da pg_stats
          s "CREATE SCHEMA rv; CREATE SEQUENCE rv.contatore; CREATE TABLE rv.t (x int); CREATE TABLE rv.autisti (cf text)"
          s "INSERT INTO rv.autisti SELECT 'RSSMRA' || g FROM generate_series(1, 200) g; ANALYZE rv.autisti"
          a_mano "GRANT USAGE, SELECT, UPDATE ON SEQUENCE rv.contatore TO PUBLIC" 'REVOKE ALL ON SEQUENCE "rv"."contatore" FROM PUBLIC' \
            "REVOKE ALL ON SEQUENCE rv.contatore FROM PUBLIC"
          a_mano "GRANT MAINTAIN ON rv.t TO PUBLIC" 'REVOKE ALL ON TABLE "rv"."t" FROM PUBLIC' "REVOKE ALL ON rv.t FROM PUBLIC"
          a_mano "GRANT SELECT ON rv.autisti TO PUBLIC" 'pg_stats' "REVOKE SELECT ON rv.autisti FROM PUBLIC"
          s "DROP SCHEMA rv CASCADE"
          da_solo "GRANT CREATE ON SCHEMA pg_catalog TO argos_ro"
          a_mano "GRANT MAINTAIN ON pg_catalog.pg_class TO PUBLIC" 'REVOKE MAINTAIN ON TABLE "pg_catalog"."pg_class" FROM PUBLIC' \
            "REVOKE MAINTAIN ON pg_catalog.pg_class FROM PUBLIC"
          s "CREATE FUNCTION public.ci_passo(stato text, q text) RETURNS text LANGUAGE plpgsql SECURITY DEFINER AS 'BEGIN RETURN q; END'; REVOKE ALL ON FUNCTION public.ci_passo(text, text) FROM PUBLIC"
          a_mano "CREATE AGGREGATE public.ci_agg(text) (SFUNC = public.ci_passo, STYPE = text)" "aggregato" "DROP AGGREGATE public.ci_agg(text)"
          s "DROP FUNCTION public.ci_passo(text, text)"
          s "CREATE SCHEMA ev; CREATE FUNCTION ev.registra() RETURNS event_trigger LANGUAGE plpgsql SECURITY DEFINER AS 'BEGIN NULL; END'; REVOKE ALL ON FUNCTION ev.registra() FROM PUBLIC"
          a_mano "CREATE EVENT TRIGGER ci_ddl ON ddl_command_end EXECUTE FUNCTION ev.registra()" "event trigger ci_ddl" "DROP EVENT TRIGGER ci_ddl"
          s "DROP SCHEMA ev CASCADE"
          a_mano "CREATE SCHEMA ci_op; REVOKE ALL ON SCHEMA ci_op FROM PUBLIC; CREATE FUNCTION ci_op.cmp(int4, int4) RETURNS int LANGUAGE sql SECURITY DEFINER AS 'SELECT btint4cmp(\$1, \$2)'; REVOKE ALL ON FUNCTION ci_op.cmp(int4, int4) FROM PUBLIC; CREATE OPERATOR CLASS ci_op.ord FOR TYPE int4 USING btree AS OPERATOR 1 <, OPERATOR 3 =, FUNCTION 1 ci_op.cmp(int4, int4)" \
