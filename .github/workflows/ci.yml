          a_mano "GRANT SET ON PARAMETER work_mem TO terzo WITH GRANT OPTION; SET ROLE terzo; GRANT SET ON PARAMETER work_mem TO argos_ro; RESET ROLE" \
            'SET ROLE "terzo"; REVOKE ALL ON PARAMETER "work_mem" FROM "argos_ro"' \
            "SET ROLE terzo; REVOKE ALL ON PARAMETER work_mem FROM argos_ro; RESET ROLE; REVOKE ALL ON PARAMETER work_mem FROM terzo"
          echo "::group::contratto salvato: un trigger estraneo lo rende inaffidabile, scritto_da non si falsifica"
          s "CREATE FUNCTION cerbero_migrazioni.zz() RETURNS trigger LANGUAGE plpgsql AS 'BEGIN RETURN NEW; END'; CREATE TRIGGER zz BEFORE UPDATE ON cerbero_migrazioni.contratti FOR EACH ROW EXECUTE FUNCTION cerbero_migrazioni.zz()"
          if p > v.log 2>&1; then cat v.log; echo "doveva rifiutare il contratto"; exit 1; fi
          grep -q "trigger estraneo" v.log || { cat v.log; exit 1; }
          if prova 2>/dev/null; then echo "il test SQL doveva fallire"; exit 1; fi
          s "DROP TRIGGER zz ON cerbero_migrazioni.contratti; DROP FUNCTION cerbero_migrazioni.zz()"
          in_regola
          # col nome giusto ma un'altra funzione: estraneo lo stesso
          s "CREATE FUNCTION public.ci_falso() RETURNS trigger LANGUAGE plpgsql AS 'BEGIN RETURN NEW; END'; DROP TRIGGER contratti_chi_scrive ON cerbero_migrazioni.contratti; CREATE TRIGGER contratti_chi_scrive BEFORE INSERT OR UPDATE ON cerbero_migrazioni.contratti FOR EACH ROW EXECUTE FUNCTION public.ci_falso()"
          if p > v.log 2>&1; then cat v.log; echo "doveva rifiutare il contratto"; exit 1; fi
          grep -q "trigger estraneo" v.log || { cat v.log; exit 1; }
          if prova 2>/dev/null; then echo "il test SQL doveva fallire"; exit 1; fi
          s "DROP TRIGGER contratti_chi_scrive ON cerbero_migrazioni.contratti; DROP FUNCTION public.ci_falso(); CREATE TRIGGER contratti_chi_scrive BEFORE INSERT OR UPDATE ON cerbero_migrazioni.contratti FOR EACH ROW EXECUTE FUNCTION cerbero_migrazioni.contratti_chi_scrive(); ALTER TABLE cerbero_migrazioni.contratti ENABLE ALWAYS TRIGGER contratti_chi_scrive"
          in_regola
          # la sua funzione, ma di un altro ruolo: con CREATE OR REPLACE cambierebbe le righe di chi migra
          s "ALTER FUNCTION cerbero_migrazioni.contratti_chi_scrive() OWNER TO terzo"
          if p > v.log 2>&1; then cat v.log; echo "doveva rifiutare il contratto"; exit 1; fi
          grep -q "funzione del suo trigger" v.log || { cat v.log; exit 1; }
          if prova 2>/dev/null; then echo "il test SQL doveva fallire"; exit 1; fi
          s "ALTER FUNCTION cerbero_migrazioni.contratti_chi_scrive() OWNER TO postgres"
          in_regola
          # col trigger spento, o con un trigger che la cambia, scritto_da resta quello vero (vincolo CHECK)
          psql -q -v ON_ERROR_STOP=1 -c "CREATE ROLE falsario LOGIN PASSWORD 'falsario'"
          s "GRANT USAGE ON SCHEMA cerbero_migrazioni TO falsario; GRANT ALL ON cerbero_migrazioni.contratti TO falsario; ALTER TABLE cerbero_migrazioni.contratti DISABLE TRIGGER contratti_chi_scrive"
          if PGPASSWORD=falsario psql -q -v ON_ERROR_STOP=1 -U falsario -d prod \
               -c "UPDATE cerbero_migrazioni.contratti SET versione = 99, elenco = '{public.users}', scritto_da = 'postgres'"; then
            echo "doveva rifiutare scritto_da falso"; exit 1
          fi
          if PGPASSWORD=falsario psql -q -v ON_ERROR_STOP=1 -U falsario -d prod \
               -c "CREATE FUNCTION pg_temp.f() RETURNS trigger LANGUAGE plpgsql AS 'BEGIN NEW.scritto_da := ''postgres''; RETURN NEW; END'" \
               -c "CREATE TRIGGER zz BEFORE UPDATE ON cerbero_migrazioni.contratti FOR EACH ROW EXECUTE FUNCTION pg_temp.f()" \
               -c "UPDATE cerbero_migrazioni.contratti SET versione = 98, elenco = '{public.users}'"; then
            echo "doveva rifiutare scritto_da falso (trigger temporaneo)"; exit 1
          fi
          s "REVOKE ALL ON cerbero_migrazioni.contratti FROM falsario; REVOKE ALL ON SCHEMA cerbero_migrazioni FROM falsario; ALTER TABLE cerbero_migrazioni.contratti ENABLE ALWAYS TRIGGER contratti_chi_scrive"
          test "$(psql -Atd prod -c "SELECT versione || ' ' || scritto_da FROM cerbero_migrazioni.contratti")" = "1 postgres"
          in_regola; echo "::endgroup::"
          echo "::group::contratto salvato manomesso: non vale finché non lo si riscrive"
          psql -q -v ON_ERROR_STOP=1 -c "CREATE ROLE scrittore LOGIN PASSWORD 'scrittore'"
          s "GRANT USAGE ON SCHEMA cerbero_migrazioni TO scrittore; GRANT UPDATE ON cerbero_migrazioni.contratti TO scrittore"
          PGPASSWORD=scrittore psql -q -v ON_ERROR_STOP=1 -U scrittore -d prod \
            -c "UPDATE cerbero_migrazioni.contratti SET versione = 99, elenco = '{public.users,public.gtfs_stops}'"
          if p > v.log 2>&1; then cat v.log; echo "doveva rifiutare il contratto"; exit 1; fi
          grep -q "lo può modificare anche chi non dovrebbe" v.log || { cat v.log; exit 1; }
          s "REVOKE ALL ON cerbero_migrazioni.contratti FROM scrittore; REVOKE ALL ON SCHEMA cerbero_migrazioni FROM scrittore"
          if p > v.log 2>&1; then cat v.log; echo "doveva rifiutare il contratto"; exit 1; fi
          grep -q "l'ha scritto scrittore" v.log || { cat v.log; exit 1; }
          test "$(psql -Atd prod -c "SELECT has_table_privilege('argos_ro', 'public.users', 'SELECT')")" = f
          p --forza; in_regola
          test "$(psql -Atd prod -c "SELECT versione || ' ' || scritto_da FROM cerbero_migrazioni.contratti")" = "1 postgres"
          echo "::endgroup::"
          echo "::group::commit parziale: una grant option sullo schema passata ad altri"
          s "GRANT USAGE ON SCHEMA caronte TO argos_ro WITH GRANT OPTION; SET ROLE argos_ro; GRANT USAGE ON SCHEMA caronte TO terzo; RESET ROLE"
          psql -q -v ON_ERROR_STOP=1 -d prod -f lib/db/tests/argos-come-produzione.sql
          if p > v.log 2>&1; then cat v.log; echo "doveva chiedere un intervento a mano"; exit 1; fi
          grep -qF 'REVOKE GRANT OPTION FOR ALL ON SCHEMA "caronte" FROM "argos_ro" CASCADE' v.log || { cat v.log; exit 1; }
          test "$(psql -Atd prod -c "SELECT has_table_privilege('argos_ro', 'public.users', 'SELECT')")" = f
          s 'REVOKE GRANT OPTION FOR ALL ON SCHEMA caronte FROM argos_ro CASCADE'
          p; in_regola; echo "::endgroup::"
          echo "::group::tabella dei contratti occupata: i permessi in più si tolgono, le tabelle nuove aspettano la registrazione"
          s "DELETE FROM cerbero_migrazioni.contratti; GRANT SELECT ON public.users TO argos_ro; REVOKE SELECT ON public.gtfs_stops FROM argos_ro"
          psql -q -d prod -c "BEGIN; LOCK TABLE cerbero_migrazioni.contratti IN ROW EXCLUSIVE MODE; SELECT pg_sleep(10); COMMIT" > /dev/null &
          sleep 2
          p > v.log 2>&1 || { cat v.log; exit 1; }
          grep -q "non ho dato le tabelle nuove (public.gtfs_stops)" v.log || { cat v.log; exit 1; }
          test "$(psql -Atd prod -c "SELECT has_table_privilege('argos_ro', 'public.users', 'SELECT') || ' ' || has_table_privilege('argos_ro', 'public.gtfs_stops', 'SELECT')")" = "false false"
          wait
          p | tee v.log; grep -q "contratto v1 registrato nel database" v.log
          in_regola; echo "::endgroup::"
          echo "::group::verifica da un utente senza USAGE sugli schemi: il contratto del codice, con un avviso"
          psql -q -v ON_ERROR_STOP=1 -c "CREATE ROLE lettore LOGIN PASSWORD 'lettore'"
          DATABASE_URL=${PG/postgres:prova@/lettore:lettore@}/prod node lib/db/scripts/argos-permessi.mjs --verifica > v.log 2>&1 || { cat v.log; exit 1; }
          grep -q "non è leggibile da questo utente" v.log || { cat v.log; exit 1; }
          psql -q -v ON_ERROR_STOP=1 -c "DROP ROLE lettore"; echo "::endgroup::"
          echo "::group::rollback: il contratto più nuovo del database vince"
          s "UPDATE cerbero_migrazioni.contratti SET versione = versione + 1, elenco = array_append(elenco, 'public.zones')"
          p | tee v.log; grep -q "public.zones: nel contratto, manca la lettura" v.log
          p --verifica | grep -q "salvato nel database"
          prova "$contratto,public.zones"
          p --forza | tee v.log; grep -q "public.zones: fuori dal contratto" v.log
          test "$(psql -Atd prod -c "SELECT versione FROM cerbero_migrazioni.contratti")" = 1
          in_regola; echo "::endgroup::"
          s "DROP OWNED BY terzo; DROP OWNED BY ammin; DROP OWNED BY scrittore; DROP OWNED BY falsario"
          psql -q -v ON_ERROR_STOP=1 -c "DROP ROLE terzo" -c "DROP ROLE ammin" -c "DROP ROLE scrittore" -c "DROP ROLE falsario"
      - name: Tutti e due hanno lo schema atteso
        run: |
          DATABASE_URL=$PG/vuoto node lib/db/scripts/catalogo.mjs > vuoto.json
          DATABASE_URL=$PG/prod node lib/db/scripts/catalogo.mjs > prod.json
          node lib/db/scripts/catalogo.mjs --confronta lib/db/migrations/meta/catalogo.json vuoto.json
          node lib/db/scripts/catalogo.mjs --confronta lib/db/migrations/meta/catalogo.json prod.json
      # PR 2.4: l'API non fa più DDL all'avvio; PR 2.16a: non ne fa più affatto
      # (le unità pigre che creavano tabelle al primo uso non ci sono più, lo
      # controlla un test sui sorgenti); PR 2.16b: il database glielo vieta. Il
      # bundle vero parte su un database nato solo dalle migrazioni, con un
      # event trigger che conta ogni tentativo di DDL (scatta prima di quello
      # che lo rifiuta, e una sequenza non torna indietro col rifiuto): 20 s
      # dopo l'avvio nessun tentativo, e /api/healthz dice schema ok. Tolta
      # l'ultima migrazione dal tracciamento, un container appena partito
      # risponde 503 (schema indietro): la guardia di versione.
      - name: L'API parte su un database nato solo dalle migrazioni, senza DDL
        run: |
          pnpm --filter @workspace/api-server run build
          psql -q -v ON_ERROR_STOP=1 -c "CREATE DATABASE solo_migrazioni"
          DATABASE_URL=$PG/solo_migrazioni node lib/db/scripts/migra.mjs > /dev/null
          q() { psql -d solo_migrazioni -v ON_ERROR_STOP=1 -tAq -c "$1"; }
          # PR 2.10: col registro delle modifiche acceso (le scritture dell'avvio passano dai trigger)
          q "UPDATE registro.impostazioni SET attivo = true, base_giuridica = 'prova della CI', attivato_il = now()"
          # SECURITY DEFINER: l'API è cerbero_app, e senza il trigger fallirebbe
          # facendo fallire il DDL stesso (il registro resterebbe vuoto per sbaglio)
          q "CREATE SCHEMA ci; CREATE TABLE ci.ddl (tag text, q text); CREATE SEQUENCE ci.tentativi;
             CREATE FUNCTION ci.registra() RETURNS event_trigger LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog
               AS \$\$ BEGIN PERFORM nextval('ci.tentativi'::regclass); INSERT INTO ci.ddl VALUES (tg_tag, left(current_query(), 300)); END \$\$;
             CREATE EVENT TRIGGER a_ci_ddl ON ddl_command_start EXECUTE FUNCTION ci.registra();"
          # la conta funziona: un tentativo rifiutato resta contato, poi si azzera
          if psql "$PG_APP/solo_migrazioni" -q -c "CREATE TEMP TABLE ci_t (a int)" 2> /dev/null; then echo "cerbero_app non doveva creare una tabella temporanea"; exit 1; fi
          test "$(q "SELECT is_called::text || '/' || (SELECT count(*) FROM ci.ddl) FROM ci.tentativi")" = true/0
          q "SELECT setval('ci.tentativi', 1, false)" > /dev/null
          avvia() {
            PORT=8099 DATABASE_URL=$PG_APP/solo_migrazioni JWT_SECRET="ci-$(openssl rand -hex 16)" CERBERO_CHIAVE_MFA="$(openssl rand -hex 32)" \
              node artifacts/api-server/dist/index.cjs > "api-$1.log" 2>&1 &
            echo $! > api.pid
            for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8099/api/healthz && break; sleep 0.5; done
            sleep 3
          }
          ferma() { kill "$(cat api.pid)"; wait "$(cat api.pid)" 2>/dev/null || true; }
          salute() { curl -s -o salute.json -w '%{http_code}' http://127.0.0.1:8099/api/healthz; echo " $(cat salute.json)"; }
          avvia ok
          esito=$(salute); echo "$esito"
          [[ "$esito" == 200* && "$esito" == *'"schema":"ok"'* ]] || { cat api-ok.log; exit 1; }
          # anche i lavori d'avvio a tempo: warm-up a 2 s, attivazioni programmate a 15 s
          sleep 17
          n=$(q "SELECT count(*) FROM ci.ddl")
          [ "$n" = 0 ] || { echo "DDL all'avvio:"; q "SELECT tag, q FROM ci.ddl"; exit 1; }
          [ "$(q "SELECT is_called FROM ci.tentativi")" = f ] || { echo "l'API ha tentato del DDL (rifiutato)"; cat api-ok.log; exit 1; }
          # PR 2.8: lavora come cerbero_owner, senza «permission denied» (42501)
          grep -q "lavora come cerbero_owner" api-ok.log || { cat api-ok.log; exit 1; }
          if grep -Ei "permission denied|42501|non può eseguire" api-ok.log; then exit 1; fi
          ferma
          q "DELETE FROM cerbero_migrazioni.__drizzle_migrations WHERE created_at = (SELECT max(created_at) FROM cerbero_migrazioni.__drizzle_migrations)"
          avvia indietro
          esito=$(salute); echo "$esito"
          ferma
          [[ "$esito" == 503* && "$esito" == *'"schema":"indietro"'* ]] || { cat api-indietro.log; exit 1; }
          grep -q "schema del database è indietro" api-indietro.log
      # PR 2.5: il lavoratore dei calcoli dal bundle, su un database migrato:
      # /api/healthz ok; prende un lavoro python (crew_misto.py, che non usa
      # OR-Tools) e lo chiude «completato»; uno script fuori elenco finisce
      # «fallito, sistema» senza partire; al SIGTERM si ferma in ordine.
      # PR 2.6: conosce i turni macchina e i giri di Argos; un turno macchina
      # su un feed senza servizio quel giorno risponde NO_INPUT.
      # PR 2.7a: conosce la sincronizzazione dei feed (materializza_feed).
      - name: Il lavoratore prende ed esegue i lavori della coda
        run: |
          psql -q -v ON_ERROR_STOP=1 -c "CREATE DATABASE lavoratore"
          DATABASE_URL=$PG/lavoratore node lib/db/scripts/migra.mjs > /dev/null
          q() { psql -d lavoratore -v ON_ERROR_STOP=1 -tAq -c "$1"; }
          q "UPDATE registro.impostazioni SET attivo = true, base_giuridica = 'prova della CI', attivato_il = now()"
          PORT=8098 DATABASE_URL=$PG_APP/lavoratore node artifacts/api-server/dist/lavoratore.cjs > lavoratore.log 2>&1 &
          echo $! > lavoratore.pid
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8098/api/healthz && break; sleep 0.5; done
          curl -s http://127.0.0.1:8098/api/healthz | tee salute.json; echo
          grep -q '"schema":"ok"' salute.json || { cat lavoratore.log; exit 1; }
          buono=$(q "INSERT INTO coda.lavori (tipo, corsia, richiesta, timeout_sec) VALUES ('python', 'veloce', '{\"script\":\"crew_misto.py\",\"argv\":[],\"ingresso\":{}}', 60) RETURNING id" | head -1)
          # PR 2.6: un turno macchina su un feed senza servizio quel giorno → NO_INPUT, senza OR-Tools
          q "INSERT INTO gtfs_feeds (id, filename) VALUES ('00000000-0000-0000-0000-0000000000f1', 'ci.zip')"
          veicoli=$(q "INSERT INTO coda.lavori (tipo, corsia, richiesta, timeout_sec) VALUES ('ottimizza_veicoli', 'veloce', '{\"mode\":\"cpsat\",\"feedId\":\"00000000-0000-0000-0000-0000000000f1\",\"corpo\":{\"psProjectId\":\"00000000-0000-0000-0000-0000000000c1\",\"date\":\"2026-11-04\",\"routes\":[{\"routeId\":\"R1\",\"vehicleType\":\"12m\"}]}}', 3600) RETURNING id" | head -1)
          vietato=$(q "INSERT INTO coda.lavori (tipo, corsia, richiesta, timeout_sec) VALUES ('python', 'veloce', '{\"script\":\"../../etc/passwd\"}', 60) RETURNING id" | head -1)
          # PR 2.7a: una sincronizzazione su un progetto Planning Studio che non c'è → «fallito, calcolo»
          sync=$(q "INSERT INTO coda.lavori (tipo, corsia, richiesta, timeout_sec) VALUES ('materializza_feed', 'veloce', '{\"schedulingProjectId\":\"00000000-0000-0000-0000-0000000000b1\",\"psProjectId\":\"00000000-0000-0000-0000-0000000000c1\",\"utenteId\":\"00000000-0000-0000-0000-0000000000a1\"}', 60) RETURNING id" | head -1)
          for i in $(seq 1 60); do [ "$(q "SELECT count(*) FROM coda.lavori WHERE stato IN ('in_coda', 'in_corso')")" = 0 ] && break; sleep 1; done
          q "SELECT id, stato, errore_tipo, errore FROM coda.lavori"
          [ "$(q "SELECT stato FROM coda.lavori WHERE id = '$buono'")" = completato ] || { cat lavoratore.log; exit 1; }
          [ "$(q "SELECT stato || '/' || errore_tipo FROM coda.lavori WHERE id = '$vietato'")" = fallito/sistema ] || { cat lavoratore.log; exit 1; }
          [ "$(q "SELECT stato || '/' || http_codice || '/' || (risultato->>'status') FROM coda.lavori WHERE id = '$veicoli'")" = completato/200/NO_INPUT ] || { cat lavoratore.log; exit 1; }
          [ "$(q "SELECT stato || '/' || errore_tipo FROM coda.lavori WHERE id = '$sync'")" = fallito/calcolo ] || { cat lavoratore.log; exit 1; }
          grep -q 'ottimizza_veicoli@1' lavoratore.log && grep -q 'giro_agente@1' lavoratore.log && grep -q 'materializza_feed@1' lavoratore.log || { cat lavoratore.log; exit 1; }
          kill "$(cat lavoratore.pid)"; wait "$(cat lavoratore.pid)" 2>/dev/null || true
          grep -q "Lavoratore fermo" lavoratore.log || { cat lavoratore.log; exit 1; }
          grep -q "lavora come cerbero_owner" lavoratore.log || { cat lavoratore.log; exit 1; }
          if grep -Ei "permission denied|42501|non può eseguire" lavoratore.log; then exit 1; fi
      # La coda sul database: SKIP LOCKED con processi concorrenti, lease,
      # tentativi, stop, arresto, indice unico, pulizia
      - name: La coda dei lavori sul database
        run: TEST_DATABASE_URL=$PG_APP/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/coda-db.test.ts
      # L'andamento AVM: il diario aggregato in SQL e le richieste a Mizar (migrazione 0005)
      - name: L'andamento AVM e le richieste a Mizar sul database
        run: TEST_DATABASE_URL=$PG_APP/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/avm-storia-db.test.ts
      # Gli endpoint con l'SQL scritto a mano, contro lo schema vero: il
      # dettaglio fermata cercava una tabella che non c'è più e rispondeva 500
      - name: Dettaglio fermata di Planning Studio sul database migrato
        run: TEST_DATABASE_URL=$PG_APP/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/dettaglio-fermata-db.test.ts
      # L'Intermodale (hub, coincidenze, poli) su un feed e su un progetto di
      # prova: fuori da un progetto chiedeva gtfs_stops.location_type, che non
      # esiste, e confrontava i giorni di gtfs_calendar con true: sempre 500
      - name: L'Intermodale sul database migrato
        run: TEST_DATABASE_URL=$PG_APP/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/intermodal-db.test.ts
      # Turni macchina, VCSP e giri di Argos su una rete di prova, con Python
      # finto: l'ingresso dato al solver e le risposte sono fissati da istantanee
      - name: Turni macchina, VCSP e giri di Argos sul database
        run: TEST_DATABASE_URL=$PG_APP/vuoto TEST_DATABASE_MIGRATOR_URL=$PG/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/veicoli-db.test.ts src/__tests__/giro-db.test.ts
      # La materializzazione Planning Studio → feed GTFS su un progetto di prova:
      # righe gtfs_*, puntatori, feed vecchio, nodi di cambio e rotte di sincronizzazione
      - name: Materializzazione dei feed da Planning Studio sul database
        run: TEST_DATABASE_URL=$PG_APP/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/feed-ps-db.test.ts
      # Le pulizie del lavoratore: feed sintetici orfani, calcoli delle tariffe rimasti «running»
      - name: Pulizie del lavoratore sul database
        run: TEST_DATABASE_URL=$PG_APP/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/pulizie-db.test.ts
      # Chi fa la modifica (PR 2.9): ogni connessione del pool porta il contesto
      # di chi la usa (cerbero.attore/via/richiesta), anche con 100 richieste
      # concorrenti e da cerbero_app, che non è superutente
      - name: Il contesto di chi fa la modifica sulla connessione
        run: TEST_DATABASE_URL=$PG_APP/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/contesto-db.test.ts
      # PR 2.12: per chi la verifica in due passaggi è obbligatoria lo dice il
      # database (users.mfa_obbligatoria, migrazione 0008). Come cerbero_app: la
      # tabella di verità, segue ruolo e permessi, non si scrive a mano, e
      # l'app non le toglie l'espressione (PR 2.16b); se non è più calcolata
      # (lo fa il migratore, in una transazione annullata) l'API non le crede.
      - name: La verifica obbligatoria, calcolata dal database
        run: TEST_DATABASE_URL=$PG_APP/vuoto TEST_DATABASE_MIGRATOR_URL=$PG/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/mfa-obbligatoria-db.test.ts
      # PR 2.14a: i ruoli aziendali sugli utenti (migrazione 0009). Come
      # cerbero_app: i vincoli, il passaggio dei dati della migrazione riga per
      # riga (nessuno cambia accesso), e il riallineamento della vista
      # users.permissions, che la verifica in due passaggi segue.
      - name: I ruoli aziendali sugli utenti
        run: TEST_DATABASE_URL=$PG_APP/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/ruoli-utenti-db.test.ts
      # PR 2.16b: la duplicazione di un progetto di Planning Studio usava sette
      # tabelle temporanee, l'ultimo DDL dell'API. Come cerbero_app, che non ne
      # può più creare: la copia è uguale all'originale a meno degli id.
      - name: Duplicazione di un progetto di Planning Studio, senza DDL
        run: TEST_DATABASE_URL=$PG_APP/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/duplica-progetto-db.test.ts
      # La cancellazione di un progetto di Planning Studio: un ordine fisso al
      # posto dell'SQL scritto come testo e dei tentativi dentro una
      # transazione annullata. Come cerbero_app: una riga in ogni tabella del
      # progetto, nessuna dopo; una chiave che blocca dà un 409 che dice quale
      # tabella. Da migratore, in una transazione annullata: i vincoli rinati
      # nell'ordine sfavorevole fermano la sola cascata, non l'ordine fisso.
      - name: Cancellazione di un progetto di Planning Studio
        run: TEST_DATABASE_URL=$PG_APP/vuoto TEST_DATABASE_MIGRATOR_URL=$PG/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/elimina-progetto-db.test.ts
      # Il registro delle modifiche (PR 2.10), dall'app: la manutenzione e la
      # verifica sì, anche in parallelo; leggere, cancellare o spegnere no, e
      # nessun DDL (PR 2.16b), tranne la partizione che la manutenzione crea. E
      # dopo tutti i test sul database qui sopra, scritti col registro acceso:
      # nessun problema e niente nella partizione di riserva.
      - name: Il registro delle modifiche dall'app
        run: |
          TEST_DATABASE_URL=$PG_APP/vuoto TEST_DATABASE_MIGRATOR_URL=$PG/vuoto pnpm --filter @workspace/api-server exec vitest run src/__tests__/registro-db.test.ts
          test -z "$(psql -d vuoto -tAq -c "SELECT * FROM registro.verifica()")"
          # PR 2.11: i riepiloghi si sommano al COMMIT: nessun parziale resta, e ce ne sono di sommati
          test "$(psql -d vuoto -tAq -c "SELECT count(*) FROM registro.parziali")" = 0
          test "$(psql -d vuoto -tAq -c "SELECT count(*) > 0 FROM registro.modifiche WHERE riepilogo AND ruolo_db = 'cerbero_app'")" = t
          # a registro acceso le consultazioni dell'app sono annotate
          test "$(psql -d vuoto -tAq -c "SELECT count(*) > 0 FROM registro.letture WHERE ruolo_db = 'cerbero_app'")" = t
          psql -d vuoto -tAq -c "SELECT tabella, operazione, count(*), sum(righe) FROM registro.modifiche GROUP BY 1, 2 ORDER BY 1, 2"
          test "$(psql -d vuoto -tAq -c "SELECT count(*) > 0 FROM registro.modifiche WHERE ruolo_db = 'cerbero_app'")" = t
      - name: Il migratore si ferma se una migrazione rilasciata è cambiata
        run: |
          echo "-- modifica" >> lib/db/migrations/0000_baseline.sql
          if DATABASE_URL=$PG/vuoto node lib/db/scripts/migra.mjs; then echo "doveva fermarsi"; exit 1; fi
          git checkout lib/db/migrations/0000_baseline.sql
