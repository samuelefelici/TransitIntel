            "cast creato da lui" "DROP FUNCTION public.ci_firma(record)"
          # con l'EXECUTE conta anche in uno schema senza USAGE, se un oggetto la usa: un indice di public.users la valuta nel piano
          a_mano "CREATE SCHEMA ci_aperta; REVOKE ALL ON SCHEMA ci_aperta FROM PUBLIC; CREATE FUNCTION ci_aperta.f() RETURNS int LANGUAGE sql IMMUTABLE SECURITY DEFINER AS 'SELECT 1'; CREATE INDEX ci_aperta_utenti ON public.users ((ci_aperta.f()))" \
