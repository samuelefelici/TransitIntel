          a_mano "CREATE TYPE public.ci_t AS (x int); CREATE FUNCTION public.ci_js(public.ci_t) RETURNS json LANGUAGE sql SECURITY DEFINER AS 'SELECT ''{}''::json'; REVOKE ALL ON FUNCTION public.ci_js(public.ci_t) FROM PUBLIC; CREATE CAST (public.ci_t AS json) WITH FUNCTION public.ci_js(public.ci_t)" \
