packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: 12.35.1
  lucide-react: 0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.7

# Impostazioni di pnpm 10 (PR 7.16): da qui in giù valgono davvero.
#
# Una versione nuova di una dipendenza si prende solo se è uscita da almeno un
# giorno: un pacchetto compromesso di solito si scopre e si ritira prima.
minimumReleaseAge: 1440

# Solo questi pacchetti eseguono script all'installazione; gli altri no (uno
# script all'installazione è la via più comune per un pacchetto compromesso).
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

# Le dipendenze indirette ferme a versioni vulnerabili (PR 7.12): ognuna vale
# solo sotto la versione corretta e porta alla prima versione corretta.
overrides:
  '@esbuild-kit/esm-loader': 'npm:tsx@^4.21.0'
  'path-to-regexp@>=8 <8.4.0': 8.4.0
  'qs@<6.16.1': 6.16.1
  'form-data@>=4 <4.0.6': 4.0.6
  'lodash@<4.18.1': 4.18.1
  'markdown-it@>=14 <14.3.3': 14.3.3
  'linkify-it@>=5 <5.0.2': 5.0.2
  'brace-expansion@>=2 <2.1.7': 2.1.7
  'picomatch@>=4 <4.0.4': 4.0.4
  'protobufjs@>=8 <8.6.6': 8.6.6
  'protocol-buffers-schema@<3.6.1': 3.6.1
  'source-map-js@<1.2.2': 1.2.2
  'fast-copy@>=4 <4.1.0': 4.1.0
  'postcss-selector-parser@>=6 <6.1.5': 6.1.5
  'browserslist@<4.28.7': 4.28.7
  'baseline-browser-mapping@<2.11.0': 2.11.0
  '@babel/core@>=7 <7.29.6': 7.29.6
  # rehype-katex 7 vuole katex 0.16 (PR 7.17): la 0.18 ha l'API che usa
  'katex@<0.18.2': 0.18.11
